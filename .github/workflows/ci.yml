name: CI

# Every push, on every branch, plus every pull request. Not `branches: [main]`:
# a check that runs only after work has landed is not the check the badge
# claims. The `concurrency` block below is what makes that affordable: a push
# to a branch with an open PR triggers both events, and superseded runs of the
# same ref are cancelled rather than queued.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    # composer.json advertises ^8.2, so 8.2 has to actually be exercised.
    # Testing only the version the author happens to run is how a floor
    # quietly stops being true.
    #
    # The same is true of the FRAMEWORK floor, and it was not: composer.json
    # advertises illuminate ^11.0|^12.0 while testbench pinned the suite to
    # Laravel 12, so nothing had ever run the unit suite against 11. Testbench 9
    # is the Laravel 11 line and testbench 10 is the Laravel 12 line, so which
    # one is installed is what decides the framework under test.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12']
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
    # The suite talks to a real Redis on purpose: the lease and presence
    # guarantees are Redis semantics (SET NX EX, compare-and-delete, hash field
    # types), and testing them against a fake would prove nothing.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole, redis
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax check
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # Laravel 11 left security support, and the 11 half of this matrix is the
      # whole point of having one. The policy stays on everywhere else.
      - name: Allow the EOL framework the matrix exists to test
        if: matrix.laravel == '11'
        run: composer config --global policy.advisories.block false

      # This repository commits no composer.lock (it is gitignored: nothing
      # reads a library's lock but the library's own CI), so every job here has
      # always resolved dependencies fresh. The pin is not about a lock file: it
      # is that ONE resolution can only satisfy ONE Laravel line, and testbench
      # is what decides which. --no-update keeps this to a single resolution
      # rather than resolving once here and again below.
      - name: Pin the framework line under test
        run: composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: The framework under test is the one this job says it is
        run: |
          php -r '
            require "vendor/autoload.php";
            $major = explode(".", Illuminate\Foundation\Application::VERSION)[0];
            if ($major !== "${{ matrix.laravel }}") {
                fwrite(STDERR, "expected Laravel ${{ matrix.laravel }}, resolved {$major}\n");
                exit(1);
            }
            echo "Laravel ".Illuminate\Foundation\Application::VERSION."\n";'

      - name: Run test suite
        run: vendor/bin/pest

  smoke:
    name: Live server (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['11', '12']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: lightspeed

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: swoole, redis
          coverage: none

      # Laravel 11 left security support, so Composer's advisory policy now
      # refuses to install it at all. The skeleton is a disposable test
      # fixture whose whole purpose is proving this package still works on
      # 11, which requires installing 11; the policy stays on everywhere else.
      - name: Allow the EOL framework the matrix exists to test
        run: composer config --global policy.advisories.block false

      - name: Create Laravel skeleton
        run: composer create-project laravel/laravel skeleton "${{ matrix.laravel }}.*" --prefer-dist --no-interaction

      # README step 1, as literally as CI can run it: a `vcs` repository and
      # `:dev-main`, exactly the two lines the README gives, with only the URL
      # swapped from GitHub to this checkout. It has to be this checkout, or the
      # job would install whatever is already on GitHub and prove nothing about
      # the commit under test.
      #
      # A `path` repository was what this used to do, and it took a different
      # code path in Composer: it symlinks a directory and never resolves a
      # version, so it exercised neither the repository type nor the version
      # constraint a real user types. It also needed `minimum-stability dev`,
      # which the README does not tell anyone to set, and did not need, because
      # an explicit `:dev-main` carries its own stability flag.
      #
      # The branch is forced because a pull request checkout is a detached merge
      # commit, and `dev-main` needs a branch of that name to resolve to.
      - name: Install lightspeed into the skeleton (README step 1)
        working-directory: skeleton
        run: |
          git -C ../lightspeed checkout -B main
          composer config repositories.lightspeed vcs "file://$GITHUB_WORKSPACE/lightspeed"
          composer require innerloop-dev/lightspeed:dev-main --no-interaction
          composer show innerloop-dev/lightspeed | grep -q "dev-main" || { echo "the package did not install as dev-main" >&2; exit 1; }

      # The rest of the README's install steps, in the README's order, so that
      # the documented path is the path that gets tested. If the README ever
      # drifts from what actually works, this job is what notices.
      #
      # The credentials go in BEFORE lightspeed:install runs, the same way
      # example/install.sh does it: the installer keeps any non-empty value
      # and only generates what is missing, and the probes below need these
      # exact ones. BROADCAST_CONNECTION is not written here; the installer
      # rewrites the scaffold's own line in place.
      - name: Set the environment
        working-directory: skeleton
        run: |
          cat >> .env <<'ENV'
          LIGHTSPEED_APP_ID=ci-app
          LIGHTSPEED_APP_KEY=ci-key
          LIGHTSPEED_APP_SECRET=ci-secret
          LIGHTSPEED_WORKER_NUM=2
          REDIS_CLIENT=phpredis
          ENV

      - name: Set up broadcasting (README step 2)
        working-directory: skeleton
        run: |
          php artisan lightspeed:install --no-interaction
          test -f routes/channels.php || { echo "lightspeed:install did not create routes/channels.php" >&2; exit 1; }
          test -f config/broadcasting.php || { echo "lightspeed:install did not create config/broadcasting.php" >&2; exit 1; }
          grep -q "lightspeed" config/broadcasting.php || { echo "lightspeed:install did not register the lightspeed connection" >&2; exit 1; }
          grep -q "BROADCAST_CONNECTION=lightspeed" .env || { echo "lightspeed:install did not set BROADCAST_CONNECTION" >&2; exit 1; }
          grep -q "LIGHTSPEED_APP_KEY=ci-key" .env || { echo "lightspeed:install overwrote the existing app key" >&2; exit 1; }

      # A handler written the way the README's Extending section teaches, so the
      # round-trip check below exercises the documented extension path rather
      # than a fixture the package quietly ships for itself.
      - name: Add an application client-event handler
        working-directory: skeleton
        run: |
          mkdir -p app/Realtime
          cat > app/Realtime/RoundTripHandler.php <<'PHP'
          <?php

          namespace App\Realtime;

          use Lightspeed\ClientEvents\ClientEvent;
          use Lightspeed\ClientEvents\ClientEventResult;
          use Lightspeed\Contracts\ClientEventHandler;

          class RoundTripHandler implements ClientEventHandler
          {
              public function handle(ClientEvent $event): ?ClientEventResult
              {
                  if ($event->event !== 'client-round-trip-check') {
                      return null;
                  }

                  $data = (array) $event->data;

                  return ClientEventResult::response(
                      requestId: (string) ($data['requestId'] ?? ''),
                      response: ['echoed' => $data['say'] ?? null, 'userId' => $event->userId],
                  );
              }
          }
          PHP
          # lightspeed:install already published config/lightspeed.php; this
          # only registers the handler class in it.
          php -r '$c = file_get_contents("config/lightspeed.php");
            $c = preg_replace("/\x27client_event_handlers\x27 => \[/", "\x27client_event_handlers\x27 => [\n        \\\\App\\\\Realtime\\\\RoundTripHandler::class,", $c, 1);
            file_put_contents("config/lightspeed.php", $c);'
          grep -q "RoundTripHandler" config/lightspeed.php || { echo "failed to register the handler" >&2; exit 1; }

      # The other direction of the same extension path: a handler that is told
      # when a connection goes. It records what it was given so the check below
      # can read it back out of the running server.
      - name: Add an application connection-closed handler
        working-directory: skeleton
        run: |
          mkdir -p app/Realtime
          cat > app/Realtime/ClosedRecorder.php <<'PHP'
          <?php

          namespace App\Realtime;

          use Lightspeed\Connections\ConnectionClosed;
          use Lightspeed\Contracts\ConnectionClosedHandler;

          class ClosedRecorder implements ConnectionClosedHandler
          {
              public function connectionClosed(ConnectionClosed $event): void
              {
                  file_put_contents(storage_path('app/lightspeed-connection-closed.log'), json_encode([
                      'socket_id' => $event->socketId,
                      'channels' => $event->channels,
                      'presence_leaves' => $event->presenceLeaves,
                      'tags' => $event->tags,
                      'auth' => $event->authPayloads,
                      'reason' => $event->reason,
                  ]).PHP_EOL, FILE_APPEND);
              }
          }
          PHP
          php -r '$c = file_get_contents("config/lightspeed.php");
            $c = preg_replace("/\x27connection_closed_handlers\x27 => \[/", "\x27connection_closed_handlers\x27 => [\n        \\\\App\\\\Realtime\\\\ClosedRecorder::class,", $c, 1);
            file_put_contents("config/lightspeed.php", $c);'
          grep -q "ClosedRecorder" config/lightspeed.php || { echo "failed to register the handler" >&2; exit 1; }

      # README step 3, and a real gate: the doctor exits non-zero when
      # anything about the setup is broken, which is exactly what this job
      # wants to know before it starts a server.
      - name: Check the setup (README step 3)
        working-directory: skeleton
        run: php artisan lightspeed:doctor

      # Everything below runs against DEFAULT configuration, which is how a
      # user's server is configured unless they opt out.
      - name: Start lightspeed:serve
        working-directory: skeleton
        run: |
          php artisan lightspeed:serve --workers=2 --relay=1 > lightspeed.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/up; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up" >&2
          cat lightspeed.log >&2
          exit 1

      # The README claims Laravel's channel authorization is the socket's
      # authority. This fails if the unauthorized diagnostic protocol is ever
      # reachable again.
      #
      # The app key is an argument because the probe proves a LEGITIMATE client
      # can connect before it asserts anything is refused: every check in that
      # script is a refusal check, so without that control a dead port, or a
      # build with no diagnostic protocol left in it at all, passed silently.
      - name: Channel authorization cannot be bypassed
        working-directory: skeleton
        run: php ../lightspeed/tests/security/diagnostic-protocol-refused.php 127.0.0.1 8000 ci-key

      # Only correctly signed subscriptions get onto a protected channel. If
      # this fails, every Broadcast::channel rule an app writes is decorative.
      - name: Subscription authorization is enforced
        working-directory: skeleton
        run: php ../lightspeed/tests/integration/subscription-authorization-enforced.php 127.0.0.1 8000

      # The package's reason to exist: an event broadcast by Laravel, from a
      # process with no server in it, reaches a subscribed socket.
      - name: Laravel broadcasts reach a subscribed socket
        working-directory: skeleton
        run: php ../lightspeed/tests/integration/broadcast-reaches-socket.php 127.0.0.1 8000

      # The reason the package exists: a client event goes UP the socket, the
      # app's handler runs it inside Laravel, and the reply comes back down the
      # same socket on the channel the README tells clients to bind to.
      - name: A handler answers a client event on the same socket
        working-directory: skeleton
        run: php ../lightspeed/tests/integration/client-event-round-trip.php 127.0.0.1 8000

      # The application is told when a connection ends, carrying the grant that
      # connection was holding. Nothing else here checks that direction, and it
      # is the one thing about a close that cannot be observed from the wire.
      - name: An application handler is told a connection closed
        working-directory: skeleton
        run: php ../lightspeed/tests/integration/connection-closed-handler.php 127.0.0.1 8000

      - name: Pusher protocol round trip
        working-directory: skeleton
        run: php artisan lightspeed:probe --host=localhost --connect-host=127.0.0.1 --port=8000 --tls=0

      - name: Shared presence across workers
        working-directory: skeleton
        run: php artisan lightspeed:presence-probe --host=localhost --connect-host=127.0.0.1 --port=8000 --tls=0

      - name: Fan-out under load
        working-directory: skeleton
        run: php artisan lightspeed:load-probe --host=localhost --targets=127.0.0.1:8000 --connections=100

      # Cross-worker delivery is verified through the diagnostic protocol, so
      # this half runs on a server that has deliberately opted into it.
      - name: Restart with the diagnostic protocol enabled
        working-directory: skeleton
        run: |
          # The package's own stop command, not pkill: pkill starts a
          # teardown and a fixed sleep raced it for the port ("Address
          # already in use" whenever teardown took over two seconds). Stop
          # finds the listeners on the configured ports, escalates to KILL
          # after the grace period, and this job doubles as the command's
          # only live exercise.
          php artisan lightspeed:stop --force
          for i in $(seq 1 15); do
            if ! curl -sf -o /dev/null --max-time 1 http://127.0.0.1:8000/up; then
              break
            fi
            sleep 1
          done
          echo "LIGHTSPEED_DIAGNOSTICS_ENABLED=true" >> .env
          php artisan lightspeed:serve --workers=2 --relay=1 > lightspeed-diagnostics.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/up; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up" >&2
          cat lightspeed-diagnostics.log >&2
          exit 1

      # The other half of the security probe, and the reason the refusal above
      # means anything. The SAME script, against the server that deliberately
      # opted in, asserting the diagnostic protocol answers. Without this, a
      # build that had lost the diagnostic protocol entirely would satisfy the
      # refusal job perfectly while the refusal proved nothing about policy.
      - name: The diagnostic protocol is reachable exactly where it was enabled
        working-directory: skeleton
        run: php ../lightspeed/tests/security/diagnostic-protocol-refused.php 127.0.0.1 8000 ci-key --diagnostics=reachable

      - name: Cross-worker delivery through the Redis relay
        working-directory: skeleton
        run: php artisan lightspeed:relay-probe --host=localhost --connect-host=127.0.0.1 --port=8000 --tls=0 --clients=24

      - name: Server logs on failure
        if: failure()
        working-directory: skeleton
        run: |
          cat lightspeed.log || true
          cat lightspeed-diagnostics.log || true
